name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.14 · Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install in a clean environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-dev.txt
          .venv/bin/python -m pip check

      - name: Run tests
        run: .venv/bin/python -m pytest tests -q

      - name: Check lint
        run: .venv/bin/python -m ruff check app.py sera screens scripts tests

      - name: Check formatting
        run: .venv/bin/python -m ruff format --check app.py sera screens scripts tests

      # Offline mode makes no model calls. Its report contains skipped live-only cases.
      - name: Run offline evaluation
        run: .venv/bin/python scripts/evaluate.py
